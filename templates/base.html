<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmotion Weighbridge</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('imwb_theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i></div>
      <div>
        <div class="brand-t">In-Motion Weighbridge</div>
        <div class="brand-s"><span class="live-dot" id="dot"></span><span id="liveTxt">Connecting…</span></div>
      </div>
    </div>

    <nav class="nav" aria-label="Pages">
      <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Overview</a>
      <a href="{{ url_for('insights') }}"{% if request.endpoint == 'insights' %} aria-current="page"{% endif %}>Insights</a>
    </nav>

    <div class="bar-tools">
      {% block bar_tools %}{% endblock %}
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" id="themeLight" aria-pressed="true"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
        <button type="button" id="themeDark" aria-pressed="false"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>Dark</button>
      </div>
    </div>

    <div class="jspl">
      <div class="jspl-logo"><img alt="Jindal Steel" src="{{ url_for('static', filename='jspl_logo.png') }}"></div>
      <div class="jspl-text"><span class="jspl-a">Innovation for Excellence ©2026</span><span class="jspl-b">Designed and developed by</span><span class="jspl-b">Digital Transformation &amp; Automation</span></div>
    </div>
  </div>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>

<script>window.WP = { cfg: { tolerance: {{ tolerance|tojson }}, target: {{ target|tojson }} } };</script>
<script src="{{ url_for('static', filename='common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
